[pytest]
# rootdir is pipeline/ (this file's location); tests live in tests/.
# Run from pipeline/ so `import preciovivo` resolves the local package.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    publicado: guard de integridad del artefacto publicado en web/data. Lee el
        REPOSITORIO, no un tmp_path: comprueba que el índice RAG commiteado es el
        que el sitio puede usar. En CI corre como paso aparte para que su fallo
        se lea como "el artefacto publicado está mal", no como "un test roto".
